name: Keep Supabase Alive - Ummul

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Ummul Supabase
        run: |
          curl -s -o /dev/null -w "Settings: %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/ummul_app_settings?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
          curl -s -o /dev/null -w "Subscriptions: %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/ummul_subscriptions?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
