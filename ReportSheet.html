<style>
:root{
  --blue:#123d78;
  --navy:#08264d;
  --gold:#c89532;
  --gold-light:#f5e5bd;
  --pale:#f4f8fd;
  --line:#c6a45e;
  --white:#fff;
  --green:#15803d;
  --red:#b91c1c;
}
*{box-sizing:border-box}
body{
  margin:0;padding:16px;background:#e9edf3;
  color:var(--navy);font-family:Arial,Helvetica,sans-serif;
}
.controls{
  max-width:210mm;margin:0 auto 14px;background:#fff;
  padding:14px;border-radius:12px;display:flex;gap:9px;
  flex-wrap:wrap;align-items:center;box-shadow:0 4px 15px #0001;

}
.controls select,.controls button{
  padding:11px;border-radius:7px;border:1px solid #d1d5db;

}
.controls select{
  background:#fff;color:var(--navy);flex:1;min-width:110px;
}
.controls button{
  background:var(--blue);color:white;border:none;
  font-weight:bold;cursor:pointer;
}
.controls button.save{background:var(--green)}

.sheet{

.logo-area{

}
.logo-box{
  width:31mm;height:31mm;border:1mm solid var(--gold);

.logo-box img{width:100%;height:100%;object-fit:contain;display:block}
.motto{
  margin-top:1mm;border:1px solid var(--gold);border-radius:5mm;
  padding:1mm 2mm;font-size:7pt;font-weight:bold;color:var(--navy);

h1{

}
.address{font-weight:700;font-size:9.5pt;line-height:1.4;color:#344b69}
.report-title{

.write-line{

}
.term-heading{
  align-self:center;background:var(--navy);border:1px solid var(--gold);

  font-size:14pt;text-align:center;color:#fff;min-width:82mm;

table{border-collapse:collapse;width:100%;table-layout:fixed}
.marks-table{font-size:8pt}
.marks-table th,.marks-table td{

}
.marks-table thead th{
  background:var(--navy);color:white;text-align:center;

.marks-table tbody td{

.marks-table .subject-name{text-align:left;padding-left:2mm;font-weight:800}
.marks-table .overall td{

.marks-table.third{font-size:6.5pt}
.marks-table.third th,.marks-table.third td{padding:1mm .4mm}
.marks-table.third thead th{height:9mm;font-size:6.5pt}

.marks-table.third thead th.total,
.marks-table.third thead th.grade,

}
.marks-table.third thead th.subject{width:27mm}
.vertical{
  writing-mode:vertical-rl;transform:rotate(180deg);

.bottom-box{
  border:1px solid var(--gold);border-radius:3mm;

  flex-direction:column;gap:3mm;font-size:9pt;
}
.promotion-row{

  gap:3mm;font-size:10pt;font-weight:900;
}
.promotion-badge{
  padding:2mm 8mm;border-radius:5mm;background:#fff;

  text-align:center;font-size:9pt;
}
.comment{display:flex;gap:2mm;align-items:end;min-height:7mm}
.comment strong{white-space:nowrap}
.dates{
  display:grid;grid-template-columns:auto 1fr auto 1fr auto 1.2fr;
  gap:2mm;align-items:end;font-size:8pt;
}
.signature-row{
  display:grid;grid-template-columns:1fr 1fr;gap:20mm;padding:2mm 4mm 0;
}
.signature{
  text-align:center;font-size:9pt;font-weight:800;position:relative;
  display:flex;flex-direction:column;align-items:center;
}
.signature-upload-box{
  height:20mm;width:100%;border:1px dashed var(--gold);
  border-radius:2mm;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;margin-bottom:1mm;background:#fff;
  cursor:pointer;
}
.signature-upload-box img{
  width:100%;height:100%;object-fit:contain;display:none;
}
.signature-upload-box.has-img{border:1px solid #aaa}
.signature-upload-box.has-img img{
  display:block!important;width:100%!important;
  height:100%!important;object-fit:contain!important;
}
.signature-label{cursor:pointer;color:var(--blue);font-size:8pt;padding:2mm}
.signature-upload-box input[type=file]{display:none}
.remove-sig{
  position:absolute;top:-6px;right:-6px;background:#cc0000;color:#fff;
  border:none;border-radius:50%;width:20px;height:20px;
  font-size:12px;cursor:pointer;display:none;z-index:5;
}
.signature.has-img .remove-sig{display:block}
.sig-title{font-weight:900;text-align:center;width:100%;margin-top:1mm}
sup{font-size:.6em;vertical-align:super;font-weight:bold}
.grading{

  border:1px solid var(--gold);background:var(--gold-light);
  border-radius:2mm;padding:2.5mm 1mm;font-size:8pt;

@page{size:A4 portrait;margin:0}
@media print{
  body{padding:0;margin:0;background:white}
  .controls{display:none!important}

    margin:0;width:210mm;height:297mm;min-height:297mm;
    border:1.5mm solid var(--navy);outline:.5mm solid var(--gold);
    box-shadow:none;page-break-after:always;break-after:page;
  }

// TEACHER LOGIN ID
function getTeacherId(){
  return localStorage.getItem("teacherId") ||
         localStorage.getItem("teacher_id") ||
         localStorage.getItem("staffId") ||
         localStorage.getItem("userId") || "";
}

// GRADING SYSTEM
function getGrade(t){
  t=Number(t)||0;
  if(t>=70)return "A";
  if(t>=60)return "B";
  if(t>=50)return "C";
  if(t>=45)return "D";
  if(t>=40)return "E";
  return "F";
}

function getRemark(t){
  t=Number(t)||0;
  if(t>=70)return "Excellent";
  if(t>=60)return "Very Good";
  if(t>=50)return "Good";
  if(t>=45)return "Fair";
  if(t>=40)return "Poor";
  return "Very Poor";
}

function getHeadmasterComment(total){
  total=Number(total)||0;
  if(total>=900)return "Excellent performance keep it up.";
  if(total>=700)return "A very good Performance keep it up.";
  if(total>=600)return "Good performance put in more effort.";
  if(total>=500)return "Fair performance, you need to work harder.";
  if(total>=400)return "Poor performance, you need to work harder and catch up.";
  return "Very poor performance, you need to work harder and catch up.";
}

function supOrdinal(n){
  if(!n||isNaN(n))return "-";
  n=Number(n);
  let suffix="th";
  const m=n%100;
  if(m<11||m>13){
    const r=n%10;
    if(r==1)suffix="st";
    else if(r==2)suffix="nd";
    else if(r==3)suffix="rd";
  }
  return n+"<sup>"+suffix+"</sup>";
}

// SIGNATURE PREVIEW
function previewSignature(input,previewId,boxId,sigId){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=document.getElementById(previewId);
    img.src=e.target.result;
    img.style.display="block";
    img.style.width="100%";
    img.style.height="100%";
    img.style.objectFit="contain";
    document.getElementById(boxId).classList.add("has-img");
    document.getElementById(sigId).classList.add("has-img");
    const lbl=document.querySelector(`#${boxId} .signature-label`);
    if(lbl)lbl.style.display="none";
    if(previewId.includes("head"))
      CURRENT.signatures.head=e.target.result;
    else
      CURRENT.signatures.teacher=e.target.result;
  };
  reader.readAsDataURL(file);
}

function removeSignature(previewId,inputId,boxId,sigId){
  const img=document.getElementById(previewId);
  const inp=document.getElementById(inputId);
  const box=document.getElementById(boxId);
  const sig=document.getElementById(sigId);

  if(img){img.src="";img.style.display="none"}
  if(inp)inp.value="";
  if(box){
    box.classList.remove("has-img");
    const lab=box.querySelector(".signature-label");
    if(lab)lab.style.display="block";
  }
  if(sig)sig.classList.remove("has-img");

  if(previewId.includes("head"))
    CURRENT.signatures.head="";
  else
    CURRENT.signatures.teacher="";
}

// LOAD ONLY ASSIGNED CLASSES
async function loadDropdowns(){
  const teacherId=getTeacherId();
  const cSel=document.getElementById("classSelect");

  try{
    if(!teacherId){
      cSel.innerHTML='<option value="">Teacher login ID not found</option>';
      document.getElementById("status").innerText=
        "Please log in again as a teacher.";
      return;
    }

    const {data:registers,error:rError}=
      await db.from("class_registers")
        .select("class_id")
        .eq("teacher_id",teacherId);

    if(rError)throw rError;

    const classIds=[...new Set(
      (registers||[]).map(r=>r.class_id).filter(Boolean)
    )];

    cSel.innerHTML='<option value="">Select Class</option>';

    if(!classIds.length){
      cSel.innerHTML='<option value="">No class assigned to you</option>';
    }else{
      const {data:classes,error:cError}=
        await db.from("classes")
          .select("*")
          .in("id",classIds)
          .order("class_name");

      if(cError)throw cError;

      (classes||[]).forEach(c=>{
        cSel.innerHTML+=`<option value="${c.id}">${c.class_name}</option>`;
      });
    }

    const {data:terms,error:tError}=
      await db.from("terms").select("*").order("id");
    if(tError)throw tError;

    const tSel=document.getElementById("termSelect");
    tSel.innerHTML='<option value="">Select Term</option>';
    (terms||[]).forEach(t=>{
      tSel.innerHTML+=`<option value="${t.id}">${t.term_name}</option>`;
    });

    const {data:sessions,error:sError}=
      await db.from("sessions").select("*").order("id");
    if(sError)throw sError;

    const sesSel=document.getElementById("sessionSelect");
    sesSel.innerHTML='<option value="">Select Session</option>';
    (sessions||[]).forEach(s=>{
      sesSel.innerHTML+=`<option value="${s.id}">${s.session_name}</option>`;
    });

  }catch(e){
    console.error(e);
    cSel.innerHTML='<option value="">Could not load assigned classes</option>';
    document.getElementById("status").innerText="Load error: "+e.message;
  }
}

loadDropdowns();

// SAVE SIGNATURES
async function saveSignatures(){
  if(!CURRENT.classId){
    alert("Generate report first");
    return;
  }

  document.getElementById("status").innerText="Saving signatures...";

  const {error}=await db.from("signatures").upsert({
    class_id:CURRENT.classId,
    term_id:CURRENT.termId,
    session_id:CURRENT.sessionId,
    headmaster_signature:CURRENT.signatures.head,
    teacher_signature:CURRENT.signatures.teacher,
    teacher_name:localStorage.getItem("teacherName")||"Class Teacher"
  },{
    onConflict:"class_id,term_id,session_id"
  });

  if(error){
    alert(error.message);
    document.getElementById("status").innerText="Error: "+error.message;
  }else{
    document.getElementById("status").innerText="Signatures saved!";
  }
}
  
// GENERATE TEACHER REPORT
  
// GENERATE TEACHER REPORT
async function generateReport(){

  const classId=document.getElementById("classSelect").value;
  const termId=document.getElementById("termSelect").value;
  const sessionId=document.getElementById("sessionSelect").value;
  const teacherId=getTeacherId();

  if(!teacherId){
    alert("Teacher login ID not found. Please log in again.");
    return;
  }

  if(!classId||!termId||!sessionId){
    alert("Select Class, Term and Session");
    return;
  }

  document.getElementById("status").innerText="Checking assigned class...";

  try{

    // VERIFY THAT THIS CLASS IS ASSIGNED TO THIS TEACHER
    const {data:assignment,error:assignError}=
      await db.from("class_registers")
        .select("class_id")
        .eq("teacher_id",teacherId)
        .eq("class_id",classId);

    if(assignError)throw assignError;

    if(!assignment||!assignment.length){
      alert("Access denied. This class is not assigned to you.");
      document.getElementById("reportsContainer").innerHTML="";
      document.getElementById("status").innerText="Access denied";
      return;
    }

    CURRENT={
      classId,
      termId,
      sessionId,
      signatures:{head:"",teacher:""}
    };

    document.getElementById("status").innerText="Loading report...";

    const className=document.getElementById("classSelect")
      .options[document.getElementById("classSelect").selectedIndex].text;

    const termName=document.getElementById("termSelect")
      .options[document.getElementById("termSelect").selectedIndex].text;

    const sessionName=document.getElementById("sessionSelect")
      .options[document.getElementById("sessionSelect").selectedIndex].text;

    const is3rd=/3|third/i.test(termName);

    const rt=r=>r?
      (Number(r.total)||(Number(r.ca1)||0)+(Number(r.ca2)||0)+(Number(r.exam)||0)):0;

    const same=(a,b)=>String(a)===String(b);

    const resultsData=await Promise.all([

      db.from("students")
        .select("*")
        .eq("class_id",classId)
        .order("student_name"),

      db.from("class_subjects")
        .select("*")
        .eq("class_id",classId)
        .order("subject_name"),

      db.from("results")
        .select("*")
        .eq("class_id",classId)
        .eq("term_id",termId)
        .eq("session_id",sessionId),

      db.from("form_comments")
        .select("*")
        .eq("class_id",classId)
        .eq("term_id",termId)
        .eq("session_id",sessionId),

      db.from("signatures")
        .select("*")
        .eq("class_id",classId)
        .eq("term_id",termId)
        .eq("session_id",sessionId)
        .maybeSingle()

    ]);

    resultsData.forEach(result=>{
      if(result.error)throw result.error;
    });

    const allStudents=resultsData[0].data||[];
    const classSubjects=resultsData[1].data||[];
    const results=resultsData[2].data||[];
    const formComments=resultsData[3].data||[];
    const savedSigs=resultsData[4].data||null;

    let res1=[],res2=[];

    if(is3rd){

      const termOpts=[
        ...document.getElementById("termSelect").options
      ].filter(o=>o.value).map(o=>({
        id:o.value,
        name:o.text
      }));

      const t1=termOpts.find(t=>/1st|first/i.test(t.name))||termOpts[0];
      const t2=termOpts.find(t=>/2nd|second/i.test(t.name))||termOpts[1];

      if(t1&&t2){

        const q=(table,t)=>db.from(table)
          .select("*")
          .eq("class_id",classId)
          .eq("session_id",sessionId)
          .eq("term_id",t.id);

        const pr=await Promise.all([
          q("results",t1),
          q("results",t2)
        ]);

        if(pr[0].error)throw pr[0].error;
        if(pr[1].error)throw pr[1].error;

        res1=pr[0].data||[];
        res2=pr[1].data||[];
      }
    }

    if(savedSigs){
      CURRENT.signatures.head=savedSigs.headmaster_signature||"";
      CURRENT.signatures.teacher=savedSigs.teacher_signature||"";
    }

    if(!allStudents.length){
      alert("No students found in this class.");
      document.getElementById("status").innerText="No students";
      return;
    }

    const commentMap={};
    formComments.forEach(c=>commentMap[c.student_id]=c);

    const termInfo=formComments[0]||{};

    const find=(arr,sid,subjId)=>
      arr.find(x=>same(x.student_id,sid)&&same(x.subject_id,subjId));

    const cell={};

    allStudents.forEach(st=>{
      cell[st.id]={};

      classSubjects.forEach(subj=>{

        const r=find(results,st.id,subj.subject_id);
        const cur=r?rt(r):"";

        let s1="",s2="",cum=cur;

        if(is3rd){

          const r1=find(res1,st.id,subj.subject_id);
          const r2=find(res2,st.id,subj.subject_id);

          s1=r1?rt(r1):"";
          s2=r2?rt(r2):"";

          const list=[s1,s2,cur].filter(v=>v!=="");

          cum=list.length?
            list.reduce((a,b)=>a+Number(b),0):"";
        }

        cell[st.id][subj.subject_id]={cur,s1,s2,cum};

      });
    });

    let totalsMap={};
    let studentTotals=[];

    allStudents.forEach(st=>{

      let sum=0;

      classSubjects.forEach(subj=>{
        const c=cell[st.id][subj.subject_id].cum;
        sum+=Number(c)||0;
      });

      totalsMap[st.id]=sum;

      studentTotals.push({id:st.id,sum});

    });

    studentTotals.sort((a,b)=>b.sum-a.sum);

    let pos=1;
    let mapPos={};

    studentTotals.forEach((t,i)=>{
      if(i>0&&t.sum<studentTotals[i-1].sum)
        pos=i+1;

      mapPos[t.id]=pos;
    });

    const classAvg=studentTotals.length?
      studentTotals.reduce((a,b)=>a+b.sum,0)/studentTotals.length:0;

    let subjectPositions={};

    classSubjects.forEach(subj=>{

      let arr=allStudents.map(st=>({
        id:st.id,
        tot:Number(cell[st.id][subj.subject_id].cur)||0
      }));

      arr.sort((a,b)=>b.tot-a.tot);

      let p=1;
      let map={};

      arr.forEach((v,i)=>{
        if(i>0&&v.tot<arr[i-1].tot)
          p=i+1;

        if(v.tot>0)map[v.id]=p;
      });

      subjectPositions[subj.subject_id]=map;

    });

    const container=document.getElementById("reportsContainer");
    container.innerHTML="";

    // GENERATE EACH STUDENT REPORT
    allStudents.forEach((student,idx)=>{

      const overall=totalsMap[student.id]||0;

      const curTotal=classSubjects.reduce(
        (a,s)=>a+(Number(cell[student.id][s.subject_id].cur)||0),0
      );

      const headComment=getHeadmasterComment(curTotal);
      const myPos=mapPos[student.id]||"-";
      const fc=commentMap[student.id]||{};

      const admissionNo=
        student.admission_no||
        student.admission_number||
        student.reg_no||
        student.admission_id||"";

      let isPass,resultText;

      if(is3rd){
        isPass=overall>classAvg;
        resultText=isPass?"PROMOTED":"NOT PROMOTED";
      }else{
        isPass=overall>=classAvg;
        resultText=isPass?"PASS":"FAIL";
      }

      let rowsHTML="";

      classSubjects.forEach((subj,i)=>{

        const r=find(results,student.id,subj.subject_id);
        const c=cell[student.id][subj.subject_id];

        let ca1="",ca2="",exam="",total="",grade="",perc="",subjPos="",s1="",s2="",cum="",remark="";

        ca1=r?(Number(r.ca1)||0):"";
        ca2=r?(Number(r.ca2)||0):"";
        exam=r?(Number(r.exam)||0):"";

        total=c.cur;
        s1=c.s1;
        s2=c.s2;
        cum=c.cum;

        const sp=subjectPositions[subj.subject_id]?.[student.id];
        subjPos=sp?supOrdinal(sp):"-";

        if(total!==""){
          grade=getGrade(total);
          perc=total+"%";
          remark=getRemark(total);
        }

        if(is3rd){

          rowsHTML+=`
          <tr>
            <td>${i+1}</td>
            <td class="subject-name">${subj.subject_name}</td>
            <td>${ca1}</td>
            <td>${ca2}</td>
            <td>${exam}</td>
            <td><b>${total}</b></td>
            <td>${s1}</td>
            <td>${s2}</td>
            <td>${total}</td>
            <td><b>${cum}</b></td>
            <td><b>${grade}</b></td>
            <td>${perc}</td>
            <td>${subjPos}</td>
            <td>${remark}</td>
          </tr>`;

        }else{

          rowsHTML+=`
          <tr>
            <td>${i+1}</td>
            <td class="subject-name">${subj.subject_name}</td>
            <td>${ca1}</td>
            <td>${ca2}</td>
            <td>${exam}</td>
            <td><b>${total}</b></td>
            <td><b>${grade}</b></td>
            <td>${perc}</td>
            <td>${subjPos}</td>
            <td>${remark}</td>
          </tr>`;

        }

      });

      const headerHTML=is3rd?`

      <div class="term-heading">3RD TERM REPORT</div>

      <table class="marks-table third">
      <thead>
      <tr>
        <th rowspan="2" style="width:8mm">S/N</th>
        <th rowspan="2" class="subject">SUBJECTS</th>
        <th rowspan="2" class="small"><div class="vertical">1st Assessment</div></th>
        <th rowspan="2" class="small"><div class="vertical">2nd Assessment</div></th>
        <th rowspan="2" class="small"><div class="vertical">Exam Score</div></th>
        <th rowspan="2" class="total"><div class="vertical">Total</div></th>
        <th rowspan="2" class="small"><div class="vertical">1st Term Score</div></th>
        <th rowspan="2" class="small"><div class="vertical">2nd Term Score</div></th>
        <th rowspan="2" class="small"><div class="vertical">3rd Term Score</div></th>
        <th rowspan="2" class="total"><div class="vertical">Total</div></th>
        <th rowspan="2" class="grade"><div class="vertical">Grade</div></th>
        <th rowspan="2" class="percentage"><div class="vertical">Percentage %</div></th>
        <th rowspan="2" class="position"><div class="vertical">Position</div></th>
        <th rowspan="2"><div class="vertical">Remark</div></th>
      </tr>
      </thead>`:`

      <div class="term-heading">${termName.toUpperCase()} REPORT</div>

      <table class="marks-table">
      <thead>
      <tr>
        <th style="width:8mm">S/N</th>
        <th>SUBJECTS</th>
        <th>1st C.A<br>(20)</th>
        <th>2nd C.A<br>(20)</th>
        <th>Exam<br>(60)</th>
        <th>Total<br>(100)</th>
        <th>Grade</th>
        <th>Percent %</th>
        <th>Position</th>
        <th>Remark</th>
      </tr>
      </thead>`;

      const badge=`
      <div class="promotion-badge"
      style="background:${isPass?'#d1fae5':'#fee2e2'};
      color:${isPass?'#065f46':'#991b1b'}">
      ${resultText}
      </div>`;

      const footHTML=is3rd?`

      <tr class="overall">
        <td colspan="3" style="text-align:right">Overall Total (all terms):</td>
        <td colspan="2" style="text-align:center">${overall}</td>
        <td colspan="4" style="text-align:right">Class Avg: ${classAvg.toFixed(2)}</td>
        <td colspan="5">${badge}</td>
      </tr>`:`

      <tr class="overall">
        <td colspan="3" style="text-align:right">Overall Total:</td>
        <td colspan="2" style="text-align:center">${overall}</td>
        <td colspan="3" style="text-align:right">Avg: ${classAvg.toFixed(2)}</td>
        <td colspan="2">${badge}</td>
      </tr>`;

      const sheet=document.createElement("main");
      sheet.className="sheet";

      sheet.innerHTML=`

      <header class="school-header">

        <div class="logo-area">
          <div class="logo-box">
            <img src="mine-logo.png" alt="School Logo">
          </div>
          <div class="motto">Knowledge Is Light</div>
        </div>

        <div>
          <h1>STANDARD UMMUL QURA'AN ACADEMY, SOKOTO</h1>
          <div class="address">
            Extension Houses, Gidan Fulani Layout, Behind 8 Division
            <br>
            SOKOTO STATE | Phone: 09034579832
          </div>
          <div class="report-title">END OF TERM EXAMINATION</div>
        </div>

      </header>

      <section class="student-info">

        <div class="field">
          <strong>Student's Name:</strong>
          <span class="write-line">${student.student_name}</span>
        </div>

        <div class="field">
          <strong>Admission No:</strong>
          <span class="write-line">${admissionNo}</span>
        </div>

        <div class="field">
          <strong>Academic Session:</strong>
          <span class="write-line">${sessionName}</span>
        </div>

        <div class="field">
          <strong>Class:</strong>
          <span class="write-line">${className}</span>
        </div>

        <div class="field">
          <strong>Out of:</strong>
          <span class="write-line">${allStudents.length}</span>
        </div>

        <div class="field">
          <strong>Position:</strong>
          <span class="write-line">${typeof myPos=="number"?supOrdinal(myPos):myPos}</span>
        </div>

        <div class="field">
          <strong>Number of Days Present:</strong>
          <span class="write-line">${fc.days_present||""}</span>
        </div>

        <div class="field">
          <strong>Total Days School Opened:</strong>
          <span class="write-line">${termInfo.total_days_opened||""}</span>
        </div>

        <div></div>
      </section>

      ${headerHTML}

      <tbody>${rowsHTML}</tbody>

      <tfoot>${footHTML}</tfoot>

      </table>

      <section class="bottom-box">

        <div class="promotion-row">
          <span>Result:</span>
          ${badge}
        </div>

        <div class="comment">
          <strong>Class Teacher's Comment:</strong>
          <span class="write-line">${fc.form_master_comment||""}</span>
        </div>

        <div class="comment">
          <strong>Headmaster's Comment:</strong>
          <span class="write-line">${headComment}</span>
        </div>

        <div class="dates">
          <strong>Term began</strong>
          <span class="write-line">${fc.term_began||termInfo.term_began||""}</span>
          <strong>Ended</strong>
          <span class="write-line">${fc.term_ended||termInfo.term_ended||""}</span>
          <strong>Next Term</strong>
          <span class="write-line">${fc.next_term_begins||termInfo.next_term_begins||""}</span>
        </div>

      </section>

      <section class="signature-row">

        <div class="signature" id="sigHead_${idx}">
          <div class="signature-upload-box ${CURRENT.signatures.head?'has-img':''}"
          id="box_head_${idx}"
          onclick="document.getElementById('headIn_${idx}').click()">

            <label class="signature-label"
            style="${CURRENT.signatures.head?'display:none':''}">
              Upload Headmaster Signature
            </label>

            <input type="file" id="headIn_${idx}" accept="image/*"
            onchange="previewSignature(this,'headImg_${idx}','box_head_${idx}','sigHead_${idx}')">

            <img id="headImg_${idx}"
            src="${CURRENT.signatures.head||''}"
            style="${CURRENT.signatures.head?'display:block;width:100%;height:100%;object-fit:contain':''}">
          </div>

          <button class="remove-sig"
          onclick="removeSignature('headImg_${idx}','headIn_${idx}','box_head_${idx}','sigHead_${idx}')">×</button>

          <div class="sig-title">Headmaster</div>
        </div>

        <div class="signature" id="sigTeach_${idx}">
          <div class="signature-upload-box ${CURRENT.signatures.teacher?'has-img':''}"
          id="box_teach_${idx}"
          onclick="document.getElementById('teachIn_${idx}').click()">

            <label class="signature-label"
            style="${CURRENT.signatures.teacher?'display:none':''}">
              Upload Class Teacher Signature
            </label>

            <input type="file" id="teachIn_${idx}" accept="image/*"
            onchange="previewSignature(this,'teachImg_${idx}','box_teach_${idx}','sigTeach_${idx}')">

            <img id="teachImg_${idx}"
            src="${CURRENT.signatures.teacher||''}"
            style="${CURRENT.signatures.teacher?'display:block;width:100%;height:100%;object-fit:contain':''}">
          </div>

          <button class="remove-sig"
          onclick="removeSignature('teachImg_${idx}','teachIn_${idx}','box_teach_${idx}','sigTeach_${idx}')">×</button>

          <div class="sig-title">Class Teacher</div>
        </div>

      </section>

      <footer class="grading">
        <span>A (70-100)</span>
        <span>B (60-69)</span>
        <span>C (50-59)</span>
        <span>D (45-49)</span>
        <span>E (40-44)</span>
        <span>F (0-39)</span>
      </footer>

      `;

      container.appendChild(sheet);

    });

    document.getElementById("status").innerText=
      `Generated ${allStudents.length} students - Average ${classAvg.toFixed(2)}`;

  }catch(err){

    console.error(err);
    alert("Error: "+err.message);
    document.getElementById("status").innerText="Error: "+err.message;

  }
}
</script>
</body>
</html>
